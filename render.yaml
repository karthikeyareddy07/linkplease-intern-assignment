services:
  - type: web
    name: linkplease-automation-service
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PSEUDOGRAM_API_KEY
        sync: false
      - key: PSEUDOGRAM_BASE_URL
        value: https://pseudogram-api.onrender.com
      - key: DATABASE_PATH
        value: linkplease.db
      - key: REQUIRE_WEBHOOK_SIGNATURE
        value: "false"
